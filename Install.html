<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1 {
      font-size: 26px;
    }

    .schedule {
      background: #f5f5f5;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .schedule div {
      margin: 8px 0;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

  </style>

</head>

<body>

  <h1>Install Contact Sync</h1>

  <p>
    This will install the automatic Contact Sync system
    for your Google account.
  </p>

  <div class="schedule">

    <div>
      <strong>01:00</strong>
      — Update Master Contacts
    </div>

    <div>
      <strong>02:00</strong>
      — Retrieve Google Contacts
    </div>

    <div>
      <strong>03:00</strong>
      — Synchronize Contacts to Google
    </div>

  </div>

  <p>
    Click the button below to install the automatic
    synchronization triggers.
  </p>

  <button
    id="installButton"
    onclick="installSync()"
  >
    Install Sync System
  </button>

  <div id="status"></div>

  <script>

    function installSync() {

      var button =
        document.getElementById(
          "installButton"
        );

      var status =
        document.getElementById(
          "status"
        );

      button.disabled = true;

      button.innerText =
        "Installing...";

      status.innerText =
        "";

      google.script.run

        .withSuccessHandler(
          function(result) {

            if (
              result &&
              result.success
            ) {

              status.innerText =
                result.message;

              button.innerText =
                "Sync Installed";

            }
            else {

              status.innerText =
                result &&
                result.message
                  ? result.message
                  : "Installation failed.";

              button.disabled = false;

              button.innerText =
                "Try Again";
            }

          }
        )

        .withFailureHandler(
          function(error) {

            status.innerText =
              "Installation failed. Please try again.";

            button.disabled = false;

            button.innerText =
              "Try Again";
          }
        )

        .InstallSyncSystem();
    }

  </script>

</body>

</html>
